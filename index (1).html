<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Perlina — Beaded Flower Atelier</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Be+Vietnam+Pro:wght@300;400;500&display=swap">
<style>
:root{--bg:#F4EDDE;--card:#FBF8F2;--alt:#E8DCC4;--rose:#D4BCB1;--mute:#6f6159;--ink:#2E2623;--cara:#8B5A3C;--on:#F4EDDE;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1F1A18;--card:#2A2321;--alt:#33292A;--rose:#7d655c;--mute:#b3a49b;--ink:#F4EDDE;--cara:#c28a63;--on:#1F1A18;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1F1A18;--card:#2A2321;--alt:#33292A;--rose:#7d655c;--mute:#b3a49b;--ink:#F4EDDE;--cara:#c28a63;--on:#1F1A18;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:300 15px/1.65 "Be Vietnam Pro",system-ui,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;line-height:1.1;margin:0}h1{font-size:clamp(40px,6.5vw,76px);letter-spacing:.01em}h2{font-size:clamp(30px,4vw,46px);margin-bottom:18px}h3{font-size:21px}
.w{max-width:1180px;margin:auto;padding:0 20px}.pg{padding:44px 0 70px}.alt{background:var(--alt)}.sec{padding:64px 0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rose)}
nav{display:flex;align-items:center;gap:22px;height:64px}nav .logo{font:500 30px "Cormorant Garamond",serif;letter-spacing:.14em;margin-right:auto;cursor:pointer;background:none;border:0;color:var(--ink)}
nav button.l{background:none;border:0;color:var(--ink);font:inherit;cursor:pointer;padding:6px 0;border-bottom:1px solid transparent}nav button.l:hover,nav button.l.on{border-color:var(--ink)}
.menu{display:flex;gap:22px}.bag{position:relative}.bag b{font-weight:500;margin-left:4px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cara);outline-offset:2px}
.btn{background:var(--ink);color:var(--on);border:1px solid var(--ink);padding:12px 24px;font:400 14px "Be Vietnam Pro",sans-serif;letter-spacing:.04em;cursor:pointer;border-radius:2px;transition:background .25s,color .25s}.btn.o{background:none;color:var(--ink);border-color:var(--rose)}.btn.o:hover{background:var(--rose);color:#2E2623}.btn:disabled{opacity:.4;cursor:not-allowed}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center;padding:56px 0}.hero img{width:100%;height:min(74vh,640px);object-fit:cover;border-radius:2px}.hero p{max-width:44ch;color:var(--mute);margin:20px 0 28px}.row{display:flex;gap:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:26px}.card{display:flex;flex-direction:column;gap:8px}.card .im{padding:0;border:0;background:var(--card);cursor:pointer;aspect-ratio:4/5;overflow:hidden}.card img{width:100%;height:100%;object-fit:cover;transition:transform .6s}.card .im:hover img{transform:scale(1.04)}.ci{display:flex;justify-content:space-between;gap:10px}.ci span{color:var(--mute);white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}.two img{width:100%;border-radius:2px}.two p{color:var(--mute);max-width:52ch}
.ig{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.ig img{width:100%;aspect-ratio:1;object-fit:cover}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px;align-items:center}.chip{background:none;border:1px solid var(--rose);color:var(--ink);padding:7px 16px;border-radius:30px;cursor:pointer;font:inherit}.chip.on{background:var(--ink);color:var(--on);border-color:var(--ink)}
select,input,textarea{background:var(--card);color:var(--ink);border:1px solid var(--rose);padding:10px 12px;font:inherit;border-radius:2px;width:100%}.bar select{width:auto}
.bld{display:grid;grid-template-columns:300px 1fr 310px;gap:26px;align-items:start}.panel{background:var(--card);padding:18px;border:1px solid var(--rose)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--alt)}.it .n{flex:1;line-height:1.3}.it small{color:var(--mute);display:block}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--rose);background:none;color:var(--ink);cursor:pointer}.sw{width:30px;height:30px;border-radius:50%;flex:none}
.prev{background:var(--card);border:1px solid var(--rose);position:sticky;top:80px}.prev svg{width:100%;display:block}.prev small{display:block;text-align:center;color:var(--mute);padding:6px 10px 12px}
.tot{font:500 30px "Cormorant Garamond",serif;display:flex;justify-content:space-between;margin:14px 0}.ln{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute)}
dialog{background:var(--bg);color:var(--ink);border:1px solid var(--rose);max-width:860px;width:92vw;padding:0}dialog::backdrop{background:#0008}.dg{display:grid;grid-template-columns:1fr 1fr}.dg img{width:100%;height:100%;object-fit:cover;max-height:560px}.dg>div{padding:26px;display:flex;flex-direction:column;gap:12px}
.cr{display:grid;grid-template-columns:90px 1fr auto;gap:16px;padding:16px 0;border-bottom:1px solid var(--rose);align-items:start}.cr img,.cr svg{width:90px;height:110px;object-fit:cover;background:var(--card)}
.f{display:grid;gap:12px;max-width:520px}.f label{display:grid;gap:4px}.er{color:#b3412f;font-size:13px;min-height:1em}.note{border:1px dashed var(--mute);padding:12px;color:var(--mute);font-size:13px}
footer{background:var(--cara);color:#F4EDDE;padding:46px 0}footer .w{display:flex;gap:40px;flex-wrap:wrap;justify-content:space-between}footer button,footer a{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0;display:block;text-align:left;margin:4px 0}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;text-align:center;padding:24px}#gate .b{max-width:420px;display:grid;gap:14px}#gate .logo{font:500 48px "Cormorant Garamond",serif;letter-spacing:.18em}
.ok{font-family:"Cormorant Garamond",serif;font-size:26px}
@media(max-width:900px){.hero,.two,.dg{grid-template-columns:1fr}.bld{grid-template-columns:1fr}.prev{top:70px;z-index:5}.menu{display:none}.ig{grid-template-columns:repeat(2,1fr)}nav{gap:14px}.mm{display:flex!important}}.mm{display:none;gap:12px;overflow-x:auto;padding:8px 20px;border-bottom:1px solid var(--rose)}.mm button{background:none;border:0;color:var(--ink);font:inherit;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

const fl=c=>B.filter(b=>b.g=="F").flatMap(b=>Array(c.sel[b.id]||0).fill(b)).sort((a,b)=>b.r-a.r);
const SL=[[150,150],[104,172],[196,172],[128,108],[172,104],[74,208],[226,208],[150,66],[96,66],[204,70]];
function pet(b,x,y){const s={lotus:[10,12,26,360],tulip:[3,14,30,40],orch:[5,17,22,360],lily:[6,8,30,360],bud:[1,13,20,0]}[b.k],[n,rx,ry,sp]=s,S=b.r;let o=`<g transform="translate(${x} ${y}) scale(${S})">`;
for(let i=0;i<n;i++){const a=n==1?0:sp==360?i*360/n:i*sp/(n-1)-sp/2;o+=`<ellipse cy="${-ry*.55}" rx="${rx}" ry="${ry}" fill="${b.c}" stroke="${b.d}" stroke-width="1.3" transform="rotate(${a})"/>`}
if(b.k=="lotus")for(let i=0;i<8;i++)o+=`<ellipse cy="-9" rx="7" ry="14" fill="#fbeaee" stroke="${b.d}" stroke-width=".8" transform="rotate(${i*45+20})"/>`;
return o+(sp==360?`<circle r="5" fill="#d9b77a"/>`:"")+"</g>"}
function svg(c){const f=fl(c).slice(0,10),n=B.filter(b=>b.g=="L"&&c.sel[b.id]);let o="";
const LP=[[92,150,-50],[208,150,50],[62,196,-72],[238,196,72],[124,70,-18],[178,66,18],[150,40,0]];let li=0;
n.forEach(b=>{for(let q=0;q<c.sel[b.id];q++){if(b.k=="strand"||b.k=="pearl"){const s=q%2?1:-1;o+=`<path d="M150 292 C${150+s*90} 292 ${150+s*95} 330 ${150+s*(60+q*12)} 372" fill="none" stroke="${b.c}" stroke-width="${b.k=="pearl"?5:4}" stroke-dasharray="${b.k=="pearl"?"1 6":"2 3"}" stroke-linecap="round"/>`}else{const p=LP[li++%7];o+=b.k=="leaf"?`<ellipse cx="${p[0]}" cy="${p[1]}" rx="16" ry="34" fill="${b.c}" stroke="#6f9a78" stroke-width="1.3" transform="rotate(${p[2]} ${p[0]} ${p[1]})"/>`:`<path d="M150 300 Q${p[0]} ${p[1]+40} ${p[0]} ${p[1]-10}" fill="none" stroke="${b.c}" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 6"/>`}}});
f.forEach((b,i)=>{o+=`<path d="M${SL[i][0]} ${SL[i][1]} Q150 250 150 300" stroke="#6b7a4a" stroke-width="3" fill="none"/>`});
